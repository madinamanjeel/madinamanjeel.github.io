<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কিডস ফান জোন</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#24214a;--bg:#fff8ec;--sun:#ffc43d;--coral:#ff6b57;--sky:#3ea6ff;--mint:#2fcf9b;--grape:#8b5cf6;--pink:#ff7eb6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Baloo Da 2','Fredoka',sans-serif;background:var(--bg);color:var(--ink);font-size:18px}
button,a{font:inherit;color:inherit;border:0;cursor:pointer;text-decoration:none}
:focus{outline:none}
:focus-visible,.focus{outline:6px solid var(--ink);outline-offset:3px;transform:scale(1.05);z-index:5}
.wrap{max-width:1200px;margin:0 auto;padding:0 18px}
header{padding:18px 0 8px;display:flex;align-items:center;gap:14px}
.logo{width:56px;height:56px;border-radius:18px;background:var(--sun);display:grid;place-items:center;font-size:32px;box-shadow:0 5px 0 #d99a00}
h1{margin:0;font-family:'Fredoka',sans-serif;font-size:clamp(26px,5vw,44px);line-height:1}
h1 small{display:block;font-size:.4em;font-weight:500;opacity:.65;margin-top:4px}
nav{margin-left:auto;display:flex;gap:8px}
nav a{background:#fff;padding:10px 18px;border-radius:99px;font-weight:700;box-shadow:0 4px 0 #e6dcc6}
h2{font-family:'Fredoka',sans-serif;font-size:clamp(24px,4vw,34px);margin:34px 0 14px}
/* video */
.tv{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:10px}
.screen{background:var(--ink);padding:10px;border-radius:26px;box-shadow:0 8px 0 #12102b}
.vid{position:relative;padding-bottom:56.25%;border-radius:18px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chan{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.chan button{background:#fff;border-radius:20px;padding:14px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 #e6dcc6}
.chan b{font-size:34px}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.g{border-radius:28px;padding:22px 12px 16px;color:#fff;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 rgba(0,0,0,.22);transition:transform .12s}
.g:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.g b{font-size:60px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.g small{font-weight:500;opacity:.9;font-size:15px}
/* learn */
.learn{background:#fff;border-radius:32px;padding:20px;box-shadow:0 8px 0 #e6dcc6}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:#f1ecfb;padding:10px 22px;border-radius:99px;font-weight:800;font-size:20px}
.tabs button.on{background:var(--grape);color:#fff}
.lbody{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}
.big{border-radius:28px;color:#fff;text-align:center;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px}
.big .ch{font-family:'Fredoka','Baloo Da 2',sans-serif;font-size:clamp(90px,16vw,150px);line-height:1;font-weight:700}
.big .em{font-size:clamp(50px,9vw,80px)}
.big .wd{font-size:26px;font-weight:800}
.ctl{display:flex;gap:10px;margin-top:12px}
.ctl button{background:rgba(255,255,255,.28);padding:8px 18px;border-radius:99px;font-weight:800;color:#fff;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;align-content:start}
.grid button{aspect-ratio:1;border-radius:18px;background:#f4f0ff;font-size:28px;font-weight:800;font-family:'Fredoka','Baloo Da 2',sans-serif;box-shadow:0 4px 0 #ded6f5}
.grid button.on{background:var(--sun);box-shadow:0 4px 0 #d99a00}
.quiz{margin-top:20px;background:#effaf5;border-radius:26px;padding:18px;text-align:center}
.quiz .q{font-size:24px;font-weight:800}
.quiz .shape{font-size:clamp(40px,8vw,64px);min-height:80px;word-break:break-all}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.opts button{min-width:88px;padding:12px 18px;border-radius:20px;background:#fff;font-size:34px;font-weight:800;font-family:'Fredoka','Baloo Da 2',sans-serif;box-shadow:0 5px 0 #bfe6d6}
.opts .ok{background:var(--mint);color:#fff}.opts .no{background:var(--coral);color:#fff}
.stars{font-size:22px;font-weight:800;margin-top:8px}
.lbtn{width:100%;display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#8b5cf6,#3ea6ff);color:#fff;border-radius:28px;padding:20px 24px;box-shadow:0 8px 0 rgba(0,0,0,.2);text-align:left}
.lbtn span{font-size:54px}.lbtn div{flex:1}.lbtn b{display:block;font-size:30px;font-family:'Fredoka','Baloo Da 2',sans-serif}.lbtn small{opacity:.9;font-size:16px}.lbtn i{font-style:normal;font-size:30px}
body.lock{overflow:hidden}
#lp{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#lp.show{display:flex}
.lh{display:flex;align-items:center;gap:12px;padding:8px 12px 4px}
.lh h3{margin:0;font-size:22px;font-family:'Fredoka','Baloo Da 2',sans-serif}
.bk{background:var(--coral);color:#fff;border-radius:99px;padding:5px 16px;font-weight:800;font-size:16px;box-shadow:0 3px 0 #c44a3a}
.lt{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px}
.lt button{background:#f1ecfb;border-radius:99px;padding:4px 12px;font-weight:800;font-size:16px;box-shadow:0 3px 0 #ded6f5}
.lt button.on{background:var(--grape);color:#fff;box-shadow:0 3px 0 #6d3fd1}
.sd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 12px 6px;font-weight:800;font-size:14px}
.seg{display:inline-flex;background:#fff;border-radius:99px;padding:3px;box-shadow:inset 0 0 0 2px #e6dcc6}
.seg button{background:transparent;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:800}
.seg button.on{background:var(--mint);color:#fff}
.disp{margin:4px 12px 8px;border-radius:24px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;height:clamp(120px,27vh,220px);padding:6px 16px;box-shadow:0 6px 0 rgba(0,0,0,.18);flex:none}
.disp .ch{font-family:'Fredoka','Baloo Da 2',sans-serif;font-weight:700;line-height:1;font-size:clamp(64px,19vh,160px);min-width:1.1em;text-align:center}
.disp .mid{flex:1;min-width:0;text-align:center}
.disp .em{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;line-height:1.05}
.disp .wd{font-size:clamp(18px,4vh,28px);font-weight:800}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ctl button{background:rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:4px 14px;font-weight:800;font-size:18px}
.ctl .sy{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.ctl div{display:flex;gap:6px}.ctl div button{flex:1}
.ls{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 12px calc(24px + env(safe-area-inset-bottom))}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
.lg button{aspect-ratio:1;border-radius:18px;background:#f4f0ff;font-size:28px;font-weight:800;font-family:'Fredoka','Baloo Da 2',sans-serif;box-shadow:0 4px 0 #ded6f5}
.lg button.on{background:var(--sun);box-shadow:0 4px 0 #d99a00}
@media(max-height:480px){.lh{padding:4px 12px 0}.sd{padding-bottom:2px}}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.lc{border-radius:26px;padding:18px 8px 14px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.2);font-family:'Fredoka','Baloo Da 2',sans-serif}
.lc b{font-size:34px;line-height:1.1}.lc small{font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:15px;opacity:.92}
.lc:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.cbar{display:flex;justify-content:center;align-items:center;gap:12px;margin:0 12px 8px;flex:none}
.cbar button{background:#fff;border-radius:99px;padding:6px 22px;font-weight:800;font-size:20px;box-shadow:0 4px 0 #e6dcc6}
.cbar .sy{background:var(--coral);color:#fff;box-shadow:0 4px 0 #c44a3a;padding:6px 28px}
.qh{display:flex;align-items:center;justify-content:center;gap:10px}
.qh button{background:#fff;border-radius:99px;padding:2px 12px;font-size:20px;box-shadow:0 3px 0 #bfe6d6}
.mt{background:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 #e6dcc6}
.mt.off{background:#ffe3df;box-shadow:0 3px 0 #f2b5ad}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:800;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
footer{text-align:center;padding:30px 0 40px;opacity:.6;font-size:15px}
@media(max-width:760px){.tv,.lbody{grid-template-columns:1fr}nav{display:none}.chan{grid-template-columns:repeat(4,1fr)}.chan button{font-size:13px}.chan b{font-size:26px}.games{grid-template-columns:1fr 1fr;gap:12px}.g{font-size:18px}.g b{font-size:46px}}
@media(min-width:1280px){body{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">🎈</div>
  <h1>কিডস ফান জোন<small>খেলো · শেখো · দেখো</small></h1>
  <nav><a href="#games" data-f>গেমস</a><a href="#learn" data-f>শেখো</a></nav>
</header>

<section class="tv">
  <div class="screen"><div class="vid"><iframe id="vp" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube.com/embed/WDVsoDUXKEE" allowfullscreen allow="autoplay; encrypted-media"></iframe></div></div>
  <div class="chan" id="chan"></div>
</section>

<h2 id="games">🎮 গেম খেলো</h2>
<section class="games" id="gl"></section>

<h2 id="learn">📚 কিডস লার্নিং</h2>
<section class="lcards" id="lcards"></section>
<footer>D-pad (রিমোট) দিয়ে ⬆️⬇️⬅️➡️ চালাও, OK চেপে সিলেক্ট করো, Back চেপে ফিরে যাও</footer>
</div>


<div id="lp">
  <div class="sd"><button class="mt" data-f id="mute" aria-label="সাউন্ড অন/অফ">🔊</button><div class="seg" id="modes"></div></div>
  <div class="disp" id="disp">
    <div class="ch" id="ch"></div>
    <div class="mid"><div class="em" id="em"></div><div class="wd" id="wd"></div></div>
  </div>
  <div class="cbar"><button data-f id="prev">⬅️</button><button class="sy" data-f id="say">🔊 শোনো</button><button data-f id="next">➡️</button></div>
  <div class="ls" id="ls">
    <div class="lg" id="grid"></div>
    <div class="quiz" id="qz">
      <div class="qh"><div class="q" id="qq"></div></div>
      <div class="shape" id="qs"></div>
      <div class="opts" id="qo"></div>
      <div class="stars" id="st">⭐ 0</div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
// ===== সেটিংস =====
const BASE='https://merryverse.vercel.app/games/';
const GAMES=[
 ['Balloon Fire','🎈','balloon','#ff6b57','বেলুন ফাটাও'],
 ['Snake','🐍','snake','#2fcf9b','সাপ খেলা'],
 ['Ludu','🎲','ludu','#3ea6ff','লুডু'],
 ['Chess','♟️','chess','#8b5cf6','দাবা'],
 ['Cricket','🏏','cricket','#f59e0b','ক্রিকেট'],
 ['Car Racing','🏎️','carracing','#ef4444','কার রেস'],
 ['Space Impact','🚀','space-impact','#ec4899','মহাকাশ যুদ্ধ']
];
const PL='https://www.youtube.com/embed/videoseries?list=';
const CH=[['🐸','সিসিমপুর',PL+'PLSUD7pi9T9Cqvu0H_L9F_7fTpqII-IM_Q'],['🎶','বাংলা ছড়া',PL+'PLMkbcNyMykb6PQoj5B4ZTtJdNXXml03Mu'],['💁‍♀️','মিস মুন',PL+'PLbZfGz-LppPF1tTgjYvVpUef_7tqg2F76'],['🐱','টম এন্ড জেরি',PL+'PLZs0gQed9tMQcnKBoXtgJW7mq_LNtfB9g']];
// true করলে Google লগইন লাগবে (Firebase config নিজের দিয়ে বসাও)
const REQUIRE_LOGIN=false;
const FB={apiKey:"",authDomain:"",projectId:"",appId:""};

// ===== শেখার ডেটা: [অক্ষর, ইমোজি, শব্দ, (উচ্চারণ)] =====
const E=(s)=>s.split(',').map(x=>x.split('|'));
const BN=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
const bnN=n=>String(n).replace(/\d/g,d=>BN[d]);
const ENW=['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
const BNW=['এক','দুই','তিন','চার','পাঁচ','ছয়','সাত','আট','নয়','দশ'];
const P=(t,l,g)=>({t,l,g});
const GAP=450;
const DATA={
 n1:{n:'1 2 3 4',c:'#f59e0b',items:ENW.map((w,i)=>[String(i+1),'🍎'.repeat(i+1),w]),
  parts:(it,ex)=>{const n=+it[0],o=[P(it[2],'en',GAP)];if(ex)o.push(P(it[2]+' apple'+(n>1?'s':''),'en',0));return o}},
 n2:{n:'১ ২ ৩ ৪',c:'#2fcf9b',items:BNW.map((w,i)=>[bnN(i+1),'🍎'.repeat(i+1),w]),
  parts:(it,ex)=>{const o=[P(it[2],'bn',GAP)];if(ex)o.push(P(it[2]+'টি আপেল','bn',0));return o}},
 abc:{n:'A B C D',c:'#3ea6ff',items:E('A|🍎|Apple,B|⚽|Ball,C|🐱|Cat,D|🐶|Dog,E|🐘|Elephant,F|🐟|Fish,G|🍇|Grapes,H|🏠|House,I|🍦|Ice cream,J|🧃|Juice,K|🪁|Kite,L|🦁|Lion,M|🌙|Moon,N|🪺|Nest,O|🍊|Orange,P|🦜|Parrot,Q|👑|Queen,R|🐰|Rabbit,S|☀️|Sun,T|🌳|Tree,U|☂️|Umbrella,V|🚐|Van,W|⌚|Watch,X|🎹|Xylophone,Y|🪀|Yo-yo,Z|🦓|Zebra'),
  parts:(it,ex)=>{const o=[P(it[0],'en',ex?400:0)];if(ex){o.push(P(it[0]+' for','en',250),P(it[2],'en',0))}return o}},
 sw:{n:'অ আ ই ঈ',c:'#ff6b57',items:E('অ|🐍|অজগর|অজোগর,আ|🥭|আম,ই|🐭|ইঁদুর,ঈ|🦅|ঈগল,উ|🐪|উট,ঊ|🌅|ঊষা,ঋ|🧘|ঋষি,এ|🎸|একতারা,ঐ|🐘|ঐরাবত,ও|🍠|ওল,ঔ|💊|ঔষধ'),
  parts:(it,ex)=>{const c=it[0],lb=('অআ'.includes(c)?'স্বরে ':'ইউ'.includes(c)?'হ্রস্ব ':'ঈঊ'.includes(c)?'দীর্ঘ ':'')+c;const o=[P(lb,'bn',ex?GAP:0)];if(ex)o.push(P(lb+' তে '+(it[3]||it[2]),'bn',0));return o}},
 bj:{n:'ক খ গ ঘ',c:'#8b5cf6',items:E('ক|🍌|কলা,খ|🐰|খরগোশ,গ|🐄|গরু,ঘ|⏰|ঘড়ি,ঙ|🐸|ব্যাঙ,চ|🌙|চাঁদ,ছ|☂️|ছাতা,জ|🚢|জাহাজ,ঝ|🐚|ঝিনুক,ট|🍅|টমেটো,ঠ|👄|ঠোঁট,ড|🥥|ডাব,ঢ|🥁|ঢাক,ত|⭐|তারা,থ|🍽️|থালা,দ|🚪|দরজা,ধ|🌾|ধান,ন|⛵|নৌকা,প|🐦|পাখি,ফ|🌸|ফুল,ব|📖|বই,ভ|🍚|ভাত,ম|🐟|মাছ,র|📻|রেডিও,ল|🍋|লেবু,শ|🦊|শিয়াল,ষ|🐂|ষাঁড়,স|☀️|সূর্য,হ|🐘|হাতি,ড়|🪁|ঘুড়ি,য়|🦚|ময়ূর'),
  parts:(it,ex)=>{const o=[P(it[0],'bn',ex?GAP:0)];if(ex)o.push(P(it[0]+' তে '+it[2],'bn',0));return o}}
};
DATA.n1.q='How many apples are here?';DATA.n1.ql='en';
DATA.n2.q='এখানে কয়টি আপেল আছে?';DATA.n2.ql='bn';
DATA.abc.q='Which letter does this picture start with?';DATA.abc.ql='en';
DATA.sw.q=DATA.bj.q='এই ছবির প্রথম অক্ষর কোনটি?';DATA.sw.ql=DATA.bj.ql='bn';
const CAP={n1:'English Numbers',n2:'বাংলা সংখ্যা',abc:'English Letters',sw:'স্বরবর্ণ',bj:'ব্যঞ্জনবর্ণ'};
let qVis=false,qSpoken=false,lastOp=null;
let cur='n1',idx=0,stars=0,ans=null,mode='ex',gridFor='',muted=false;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let au=null,tk=0,tt;
function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2500)}

// একটি অংশ ধীরে বলে; শেষ হলে Promise resolve হয়
function clip(t,l,my,i=0){
  return new Promise(res=>{
    if(my!==tk)return res();
    const c=l.slice(0,2),q=encodeURIComponent(t),sp='&ttsspeed=0.4';
    const urls=[
      'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+c+sp+'&q='+q,
      'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl='+c+sp+'&q='+q,
      'https://translate.google.com/translate_tts?ie=UTF-8&client=gtx&tl='+c+sp+'&q='+q];
    if(i>=urls.length){
      try{
        if(!speechSynthesis.getVoices().length)throw 0;
        const u=new SpeechSynthesisUtterance(t);u.lang=l==='bn'?'bn-BD':'en-US';u.rate=.5;
        u.onend=u.onerror=()=>res();speechSynthesis.speak(u);
      }catch(e){toast('😕 সাউন্ড চলছে না (নেট/ব্লক?)');res()}
      return;
    }
    const a=new Audio();au=a;let st=false,fin=false;
    const f=()=>{if(!fin){fin=true;res()}};
    const nx=()=>{if(!fin&&!st){fin=true;clip(t,l,my,i+1).then(res)}};
    a.onplaying=()=>{st=true};
    a.onended=f;a.onerror=()=>st?f():nx();
    a.src=urls[i];
    const p=a.play();if(p&&p.catch)p.catch(nx);
    setTimeout(()=>{if(!st)nx()},3500);
    setTimeout(f,15000);
  });
}
async function speakSeq(parts){
  const my=++tk;
  try{speechSynthesis.cancel()}catch(e){}
  if(au){try{au.pause()}catch(e){}}
  for(const p of parts){
    if(my!==tk)return;
    await clip(p.t,p.l,my);
    if(p.g)await sleep(p.g);
  }
}
const say=(t,l)=>speakSeq([P(t,l,0)]);

// ===== রেন্ডার =====
$('gl').innerHTML=GAMES.map(g=>`<a class="g" data-f href="${BASE+g[2]}/index.html" style="background:${g[3]}"><b>${g[1]}</b>${g[0]}<small>${g[4]}</small></a>`).join('');
$('lcards').innerHTML=Object.keys(DATA).map(k=>`<button class="lc" data-f data-open="${k}" style="background:${DATA[k].c}"><b>${DATA[k].n}</b><small>${CAP[k]}</small></button>`).join('');
$('chan').innerHTML=CH.map((c,i)=>`<button data-f data-v="${i}"><b>${c[0]}</b>${c[1]}</button>`).join('');
$('modes').innerHTML='<button data-f data-m="ex">উদাহরণসহ</button><button data-f data-m="only">শুধু অক্ষর</button>';

function show(){
  const d=DATA[cur],it=d.items[idx],ex=mode!=='only';
  $('ch').textContent=it[0];{const e=$('em'),num=cur==='n1'||cur==='n2',n=num?idx+1:1;
  e.innerHTML=ex?(num?Array.from({length:n},()=>`<span>${it[1].slice(0,2)}</span>`).join(''):`<span>${it[1]}</span>`):'';
  e.style.fontSize=Math.min(n===1?56:n<=3?44:n<=6?34:28,innerHeight*0.075)+'px'}$('wd').textContent=ex?it[2]:'';
  $('disp').style.background=d.c;
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  if(gridFor!==cur){gridFor=cur;$('grid').innerHTML=d.items.map((x,i)=>`<button data-f data-i="${i}">${x[0]}</button>`).join('')}
  [...$('grid').children].forEach((b,i)=>b.classList.toggle('on',i===idx));
}
function speak(){const d=DATA[cur];speakSeq(d.parts(d.items[idx],mode!=='only'))}
// ===== শেখার ঘর (আলাদা ফুল স্ক্রিন) =====
function openL(){$('lp').classList.add('show');document.body.classList.add('lock');history.pushState({lp:1},'');show();quiz();$('say').focus()}
function hideL(){$('lp').classList.remove('show');document.body.classList.remove('lock');tk++;try{speechSynthesis.cancel()}catch(e){}if(au){try{au.pause()}catch(e){}}if(lastOp)lastOp.focus({preventScroll:true})}
function closeL(){if(history.state&&history.state.lp)history.back();else hideL()}
addEventListener('popstate',()=>{if($('lp').classList.contains('show'))hideL()});
function speakQ(){const d=DATA[cur];speakSeq([P(d.q,d.ql,0)])}
new IntersectionObserver(es=>{
  qVis=es[0].isIntersecting;
  if(qVis&&!qSpoken&&$('lp').classList.contains('show')){qSpoken=true;speakQ()}
},{root:$('ls'),threshold:0.6}).observe($('qz'));
function quiz(){
  const d=DATA[cur],n=d.items.length,a=Math.floor(Math.random()*n);ans=a;
  const set=new Set([a]);while(set.size<Math.min(3,n))set.add(Math.floor(Math.random()*n));
  const o=[...set].sort(()=>Math.random()-.5),num=cur==='n1'||cur==='n2';
  $('qq').textContent=d.q;qSpoken=false;
  $('qs').textContent=d.items[a][1];
  $('qo').innerHTML=o.map(i=>`<button data-f data-o="${i}">${d.items[i][0]}</button>`).join('');
  if(qVis&&$('lp').classList.contains('show')){qSpoken=true;speakQ()}
}
function pick(b){
  const bn=DATA[cur].parts({0:'',1:'',2:''},false)[0].l==='bn';
  if(+b.dataset.o===ans){b.classList.add('ok');stars++;$('st').textContent='⭐ '+stars;setTimeout(quiz,1400)}
  else{b.classList.add('no');0}
}

// ===== ক্লিক হ্যান্ডলার =====
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  const on=!muted;
  if(b.dataset.v){$('vp').src=CH[b.dataset.v][2]+'&autoplay=1';scrollTo({top:0,behavior:'smooth'})}
  else if(b.dataset.open){lastOp=b;cur=b.dataset.open;idx=0;$('ls').scrollTop=0;openL()}
  else if(b.id==='closeL')closeL();
  else if(b.dataset.t){cur=b.dataset.t;idx=0;show();quiz();$('ls').scrollTop=0}
  else if(b.dataset.i){idx=+b.dataset.i;show();if(on)speak()}
  else if(b.dataset.m){mode=b.dataset.m;show()}
  else if(b.id==='mute'){muted=!muted;b.textContent=muted?'🔇':'🔊';b.classList.toggle('off',muted);if(muted){tk++;try{speechSynthesis.cancel()}catch(e){}if(au){try{au.pause()}catch(e){}}}}
  else if(b.dataset.o)pick(b);
  else if(b.id==='next'){idx=(idx+1)%DATA[cur].items.length;show();if(on)speak()}
  else if(b.id==='prev'){idx=(idx-1+DATA[cur].items.length)%DATA[cur].items.length;show();if(on)speak()}
  else if(b.id==='say')speak();
});

// ===== D-pad / রিমোট নেভিগেশন =====
function items(){
  return [...($('lp').classList.contains('show')?$('lp'):document).querySelectorAll('[data-f]')].filter(el=>el.offsetParent!==null);
}
function nav(k){
  const all=items(),a=document.activeElement;
  if(!all.includes(a)){(all[0]||{focus(){}}).focus();return}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=1e9;
  for(const el of all){
    if(el===a)continue;
    const q=el.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy;
    const ok=k==='ArrowRight'?x>8&&Math.abs(y)<Math.abs(x)*1.6+r.height/2:k==='ArrowLeft'?x<-8&&Math.abs(y)<Math.abs(x)*1.6+r.height/2:k==='ArrowDown'?y>8&&Math.abs(x)<Math.abs(y)*1.6+r.width/2:y<-8&&Math.abs(x)<Math.abs(y)*1.6+r.width/2;
    if(!ok)continue;
    const s=Math.hypot(x,y)+(k==='ArrowLeft'||k==='ArrowRight'?Math.abs(y)*2:Math.abs(x)*2);
    if(s<bs){bs=s;best=el}
  }
  if(best){best.focus();best.scrollIntoView({block:'center',behavior:'smooth'})}
}
addEventListener('keydown',e=>{
  if(e.key.startsWith('Arrow')){e.preventDefault();nav(e.key)}
  else if(['Escape','Backspace','GoBack'].includes(e.key)&&$('lp').classList.contains('show')){e.preventDefault();closeL()}
});
// ফোকাস না থাকলে প্রথম বাটনে ফোকাস দাও (TV)
addEventListener('load',()=>{if(matchMedia('(hover:none)').matches===false)document.querySelector('.g').focus({preventScroll:true})});

// ===== ঐচ্ছিক লগইন =====
async function gate(){
  if(!REQUIRE_LOGIN)return;
  const [{initializeApp},{getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithRedirect}]=await Promise.all([
    import('https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js')]);
  const a=getAuth(initializeApp(FB));
  document.body.style.visibility='hidden';
  onAuthStateChanged(a,u=>{u?document.body.style.visibility='visible':signInWithRedirect(a,new GoogleAuthProvider())});
}
show();gate();
</script>
