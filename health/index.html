<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#087f83">
<title>HealthCare | Personal Health Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --primary:#087f83;
  --primary2:#13aaa1;
  --dark:#123b43;
  --bg:#f3f8f8;
  --white:#fff;
  --muted:#82979b;
  --border:#e7eeee;
  --shadow:0 8px 30px rgba(18,59,67,.055);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark);-webkit-tap-highlight-color:transparent;}
button,input,select{font-family:inherit}
a{text-decoration:none;color:inherit}
.wrapper{max-width:1180px;margin:auto;padding:24px}

/* LOADING & AUTH STATE */
#loading-message { text-align: center; padding-top: 150px; font-size: 1.2rem; font-weight: bold; color: var(--primary); }
#content-wrapper { display: none; }
.login-btn { background: var(--primary); color: white; border: 0; padding: 12px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 5px 15px rgba(8,127,131,0.2); transition: .2s; }
.login-btn:hover { background: #06696c; transform: translateY(-2px); }

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:47px;height:47px;background:linear-gradient(135deg,#087f83,#13b5aa);color:white;display:grid;place-items:center;border-radius:15px;font-size:22px}
.brand h2{font-size:21px;font-weight:800}
.brand p{font-size:11px;color:var(--muted)}
.header-date{font-size:12px;color:var(--muted);background:white;padding:11px 15px;border-radius:12px;border:1px solid var(--border)}

/* HERO SECTION */
.hero{background:linear-gradient(115deg,#075c65,#087f83 60%,#13aaa1);border-radius:20px;padding:20px 24px;color:white;position:relative;overflow:hidden;box-shadow:0 10px 25px #087f8325}
.hero:before{content:"";position:absolute;width:200px;height:200px;right:-50px;top:-100px;border:30px solid #ffffff12;border-radius:50%}
.hero-content{position:relative;z-index:1}
.hero-label{font-size:10px;letter-spacing:1px;color:#b8e9e5;font-weight:700;margin-bottom:8px}
.hero h1{font-size:clamp(20px,4vw,28px);line-height:1.2;max-width:550px;margin-bottom:8px}
.hero p{color:#d4eeee;font-size:12px;line-height:1.5;max-width:480px}
.hero-btn{display:inline-flex;align-items:center;gap:7px;background:white;color:var(--primary);padding:10px 15px;border-radius:9px;font-weight:700;font-size:11px;margin-top:12px}

/* SECTIONS */
.section{margin-top:35px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.section-head h3{font-size:18px;font-weight:800}
.section-head p{color:var(--muted);font-size:11px;margin-top:4px}
.section-icon{width:38px;height:38px;background:#e1f4f2;color:var(--primary);display:grid;place-items:center;border-radius:12px}

/* USER BAR & ADMIN */
.user-bar{background:#eaf7f5;padding:15px;border-radius:14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border:1px solid #d2ece8; position: relative;}
.user-info{display:flex;align-items:center;gap:11px; flex: 1; min-width: 0;}
.user-avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:white;display:grid;place-items:center;font-weight:800;font-size:15px;overflow:hidden;flex-shrink:0}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-details{flex: 1; min-width: 0; overflow: hidden;}
.user-details h4{color:var(--primary);font-size:14px;font-weight:800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.user-details p{font-size:11px;color:var(--muted);margin-top:2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

.switch-account-btn {
  background: white; border: 1px solid #a8dcd6; color: var(--primary);
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  cursor: pointer; box-shadow: 0 4px 10px rgba(8, 127, 131, 0.1);
  transition: all 0.2s ease; flex-shrink: 0;
}
.switch-account-btn:hover { background: var(--primary); color: white; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(8, 127, 131, 0.2); }

.admin-bar{width:100%;padding-top:12px;border-top:1px dashed #c0e0dc;display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.admin-bar span{font-size:11px;font-weight:700;color:#075c65}
.admin-select-btn {
  padding:8px 12px; border-radius:8px; border:1px solid var(--primary); font-size:11px; font-weight:600; background:white; color:var(--dark); outline:none; flex:1; max-width:280px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:.2s;
}
.admin-select-btn:hover { border-color: #06696c; background:#f9fbfb;}

/* QUICK LINKS */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.quick-card{background:white;padding:20px;border:1px solid var(--border);border-radius:17px;transition:.25s;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px}
.quick-card:hover,.record-card:hover{transform:translateY(-3px);border-color:#a8dcd6}
.quick-icon{min-width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:19px}
.quick-card h4{font-size:13px}
.quick-card p{font-size:10px;color:var(--muted);margin-top:4px}

/* RECORDS */
.records-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.record-card{background:white;border:1px solid var(--border);border-radius:18px;padding:19px;display:flex;align-items:center;gap:13px;transition:.2s;box-shadow:var(--shadow)}
.avatar{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:18px;font-weight:800;flex-shrink:0}
.record-info{flex:1;min-width:0}
.record-info h4{font-size:13px;overflow-wrap:anywhere}
.record-info p{color:var(--muted);font-size:10px;margin-top:5px}
.record-arrow{color:#9db2b4;font-size:13px}

/* TOOLS */
.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tool-card{background:white;border:1px solid var(--border);border-radius:19px;padding:21px;box-shadow:var(--shadow)}
.tool-top{display:flex;align-items:center;gap:12px;margin-bottom:17px}
.tool-icon{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:18px}
.tool-top h4{font-size:14px}
.tool-top p{font-size:10px;color:var(--muted);margin-top:3px}
.field{margin-bottom:12px;position:relative}
.field label{display:block;font-size:11px;color:#647d81;font-weight:600;margin-bottom:7px}
.field input, .field select{width:100%;border:1px solid var(--border);background:#f8fbfb;padding:12px;border-radius:10px;outline:none;font-size:13px;color:var(--dark)}
.field input:focus, .field select:focus{border-color:var(--primary)}

/* AUTO-COMPLETE */
.suggestions-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 99; box-shadow: var(--shadow); display: none; }
.suggestion-item { padding: 9px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f5; color: var(--dark); }
.suggestion-item:hover { background: #eaf7f5; color: var(--primary); font-weight: 600; }

.action-btn{width:100%;background:var(--primary);color:white;border:0;border-radius:10px;padding:12px;font-size:12px;font-weight:700;cursor:pointer}
.result{margin-top:13px;padding:13px;background:#eaf7f5;border-radius:11px;color:#087f83;font-size:12px;line-height:1.7;display:none}
.result strong{font-size:19px;display:block}

/* MEDICATION MANAGER */
.reminder-card{background:white;border:1px solid var(--border);border-radius:19px;padding:22px;box-shadow:var(--shadow)}
.reminder-card h4{font-size:14px}
.med-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.full-field{grid-column:1/-1}
.med-time-row{display:flex;gap:9px}
.med-time-row input{flex:1;min-width:0}
.med-time-row button{width:auto;white-space:nowrap;padding:0 15px}
.time-list{display:flex;gap:7px;flex-wrap:wrap;margin:5px 0 17px}
.time-chip{display:inline-flex;align-items:center;gap:7px;background:#eaf7f5;color:#087f83;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700}
.time-chip button{border
